# Déploiement du hub. Les paramètres fonctionnels (URL du hub pour les agents, fréquence des vérifications)
# se règlent dans l'interface : Paramètres > Agent.
#
# Options de sécurité (fichier .env à côté de ce fichier, voir .env.example et docs/securite.md) :
#   MONGO_USERNAME / MONGO_PASSWORD  compte MongoDB : la base refuse toute connexion sans mot de passe
#   HM_MASTER_KEY                    clé maître : les secrets (autorité des agents, jetons) sont chiffrés dans la base
# Sans .env, tout fonctionne comme avant : base sans authentification, secrets en clair.
services:
  hub:
    image: mathmath350/homelab-manager:latest
    container_name: homelab-manager
    restart: unless-stopped
    ports:
      - "3000:3000"           # interface et API : <port publié>:3000
      - "3443:3443"           # agents, en TLS : <port publié>:3443 (à reporter dans Paramètres > Agent s'il diffère)
      # - "4443:4443"         # interface en HTTPS (HTTPS_PORT) : certificat émis par le hub, voir docs/configuration.md
      # proxy sur le même hôte : "127.0.0.1:3000:3000" ; sur une autre machine : "<IP de l'hôte>:3000:3000" + pare-feu
    environment:
      MONGO_URL: mongodb://mongo:27017/homelab
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      HM_MASTER_KEY: ${HM_MASTER_KEY:-}
      LOG_LEVEL: info         # fatal | error | warn | info | debug
      TZ: Europe/Paris        # fuseau du hub : fuseau par défaut des sauvegardes de répertoires
      # CHANNEL: dev           # déploiement de test : affiche le bandeau « DEV » (absente : prod)
      # SESSION_IDLE_HOURS: 12  # session fermée après 12 h sans utilisation
      # SESSION_MAX_DAYS: 7     # et 7 jours après la connexion dans tous les cas
      # TRUST_PROXY: "192.168.1.20"  # OBLIGATOIRE derrière un reverse proxy : son adresse (sinon 400 untrusted_proxy) ; "true" : tout client
      # COOKIE_SECURE: "true" # cookie Secure forcé (absente : automatique, Secure dès que la requête arrive en HTTPS)
      # HTTPS_PORT: 4443      # interface aussi en HTTPS ; le port 3000 redirige alors vers lui (HTTP_MODE)
      # HTTPS_SAN: hub.lan,192.168.1.10   # noms et IP ajoutés au certificat émis
      # FEATURE_BACKUP_NEXTCLOUD_AIO: "true"  # affiche le plugin Nextcloud AIO des sauvegardes (absente : désactivé)
      # FEATURE_STANDARDISATION: "true"  # affiche et active la standardisation des hôtes (absente : désactivée)
    volumes:
      # manifeste d'accès signé (clés root, utilisateur sudo), déposé par `make access-publish` depuis le poste d'administration ;
      # lecture seule : le hub le relit, il ne peut pas le modifier (docs/standardisation.md)
      - ./access:/access:ro
      
    # Sondes « Ping » : le hub tourne en utilisateur non root (node), sans CAP_NET_RAW effectif ; ce réglage (propre au
    # conteneur) autorise le ping ICMP non privilégié, sans ajouter de capacité. Borne haute 65535 : dans un LXC non privilégié
    # les gid du conteneur s'arrêtent là, une valeur plus grande est refusée au démarrage.
    sysctls:
      net.ipv4.ping_group_range: "0 65535"
    depends_on:
      - mongo
    networks: [default, backend]

  # Accès Tailscale (hôtes hors LAN), optionnel : décommenter ce service, mettre TS_AUTHKEY dans tailscale.env,
  # puis `docker compose --profile tailscale up -d`. Mode userspace : aucun /dev/net/tun ni interface sur l'hôte
  # (fonctionne dans un LXC). Seul le port agents (3443) est relayé vers le hub, l'interface n'est pas exposée.
  # tailscale:
  #   profiles: [tailscale]
  #   image: tailscale/tailscale:stable
  #   container_name: homelab-manager-tailscale
  #   restart: unless-stopped
  #   env_file: tailscale.env            # TS_AUTHKEY=tskey-auth-… (jamais commité ; inutile après le premier démarrage)
  #   environment:
  #     TS_HOSTNAME: homelab-manager     # nom du nœud : à reporter dans Paramètres > Agent > Adresse du hub sur Tailscale
  #     TS_USERSPACE: "true"
  #     TS_STATE_DIR: /var/lib/tailscale
  #     TS_SERVE_CONFIG: /config/serve.json
  #   volumes:
  #     - ./tailscale:/var/lib/tailscale   # identité du nœud
  #     - ./tailscale-serve.json:/config/serve.json:ro
  #   depends_on:
  #     - hub

  mongo:
    # MongoDB 5+ needs a CPU with AVX; use mongo:4.4 on older hardware.
    # one step at a time: 7 -> 8.0 -> 8, the hub raises featureCompatibilityVersion at start (docs/installation.md)
    image: mongo:8.0
    container_name: homelab-manager-mongo
    restart: unless-stopped
    command: ["mongod", "--quiet"]    # sans les traces de connexions (très verbeuses)
    environment:
      # compte root créé à l'initialisation d'un mongo-data vide ; renseignés, ils activent aussi --auth
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-}
    volumes:
      - ./mongo-data:/data/db           # dossier local : survit à « docker compose down -v »
      - ./mongo-config:/data/configdb
    networks: [backend]                 # joignable par le hub seulement, sans accès au réseau extérieur

networks:
  # réseau interne : MongoDB n'a aucune route vers l'extérieur et seuls les services qui y sont reliés l'atteignent
  backend:
    internal: true
