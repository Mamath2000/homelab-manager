services:
  hub:
    image: ${HUB_IMAGE:-mathmath350/homelab-manager:latest}
    container_name: homelab-manager
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-3000}:3000"
    env_file:
      - path: .env          # optionnel, voir .env.example
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017/homelab
    depends_on:
      - mongo

  mongo:
    # MongoDB 5+ needs a CPU with AVX; use mongo:4.4 on older hardware.
    image: mongo:7
    container_name: homelab-manager-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
