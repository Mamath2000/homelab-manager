name: Docs

# Public documentation site: docs/ rendered by Docusaurus (website/) and published on GitHub Pages.
# Pull requests only build it (broken links fail the build); a push to main also deploys it.
on:
  push:
    branches: [main]
    paths: [docs/**, website/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, website/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push cancels the build still waiting, never a deployment in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Actions pinned by commit SHA (a tag can be moved), kept up to date by Dependabot (.github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: make docs-site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
