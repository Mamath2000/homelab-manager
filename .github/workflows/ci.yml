name: CI

on:
  push:
    branches: [main]
  pull_request:

# Les images Docker sont publiées sur Docker Hub par `make docker-release` (voir README).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make install
      - run: make check
