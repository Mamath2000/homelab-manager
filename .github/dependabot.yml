# Weekly dependency updates, grouped per ecosystem so that the minor and patch bumps come in one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }

  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    groups:
      go: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /hub
    schedule: { interval: weekly }
    groups:
      hub: { patterns: ['*'], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'], update-types: [minor, patch] }
    ignore:
      # typescript-eslint (lint of the interface) refuses TypeScript 7 for now: lift once it supports it
      - dependency-name: typescript
        versions: ['>=7']

  # base images of the Dockerfile (Go toolchain of the agents, Node of the hub)
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # odd Node majors are never LTS: stay on the LTS lines
      - dependency-name: node
        versions: ['>=25 <26', '>=27 <28']

  # reference compose (MongoDB)
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # MongoDB upgrades one step at a time (7 -> 8.0 -> 8.x -> 9, featureCompatibilityVersion raised by the hub in between):
      # mongod 8.1+ does not start on a base still at 7.0, so no 8.x before every instance is at 8.0
      - dependency-name: mongo
        versions: ['>=8.1']
